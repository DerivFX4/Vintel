<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VintelFX logo</title>
  <desc id="desc">VintelFX VT logo in a purple circular badge</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#44236f"/><stop offset="1" stop-color="#21104a"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#94c4e5"/><stop offset="1" stop-color="#5e86a5"/></radialGradient>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4b4b"/><stop offset="1" stop-color="#f01919"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
